name: Weekly Content Generation

on:
  schedule:
    - cron: '30 3 * * 1'   # Every Monday 9:00 AM IST (3:30 UTC)
  workflow_dispatch:        # Lets you trigger it manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Generate content for target repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private repos need a token that can read them. Create a fine-grained personal access
          # token (Contents: read-only on the target repo) and save it as SOURCE_REPO_TOKEN.
          # Public repos work without it.
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional fallback
          # Comma-separated owner/repo list. Works whether TARGET_REPOS was saved as a
          # repository Variable or a Secret; falls back to GK_AI_Trader if neither is set.
          TARGET_REPOS: ${{ vars.TARGET_REPOS || secrets.TARGET_REPOS || 'gbk09/GK_AI_Trader' }}
        run: |
          mkdir -p generated_content
          count=0
          IFS=',' read -ra REPOS <<< "$TARGET_REPOS"
          for repo in "${REPOS[@]}"; do
            repo="$(echo "$repo" | xargs)"   # trim whitespace
            [ -z "$repo" ] && continue
            echo "Generating content for: $repo"
            python github_content_generator.py "$repo" --ai --token "$SOURCE_TOKEN" \
              --out "generated_content/$(basename "$repo")"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No repos to process. Set TARGET_REPOS (owner/repo, comma-separated)."
            exit 1
          fi

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated_content/
          git diff --staged --quiet || git commit -m "Weekly content generation $(date +%Y-%m-%d)"
          git push

      - name: Notify Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="Scroll-Worthy: weekly content generated. Check generated_content/ in the repo."
          fi
