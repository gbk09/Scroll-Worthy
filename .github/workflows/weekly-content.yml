name: Weekly Content Generation

on:
  schedule:
    - cron: '30 3 * * 1'   # Every Monday 9:00 AM IST (3:30 UTC)
  workflow_dispatch:        # Lets you trigger it manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Generate content for target repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_REPOS: ${{ vars.TARGET_REPOS }}
        run: |
          IFS=',' read -ra REPOS <<< "$TARGET_REPOS"
          for repo in "${REPOS[@]}"; do
            echo "Generating content for: $repo"
            python github_content_generator.py "$repo" --ai --token "$GITHUB_TOKEN" \
              --out "generated_content/$(basename $repo)"
          done

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated_content/
          git diff --staged --quiet || git commit -m "Weekly content generation $(date +%Y-%m-%d)"
          git push

      - name: Notify Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="Scroll-Worthy: weekly content generated. Check generated_content/ in the repo."
          fi
